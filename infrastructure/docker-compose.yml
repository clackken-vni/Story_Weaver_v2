version: '3.8'

services:
  # Infrastructure Services
  postgres:
    image: postgres:16-alpine
    container_name: sw-postgres
    environment:
      POSTGRES_DB: storyweaver
      POSTGRES_USER: sw_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sw_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sw_user -d storyweaver"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sw-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: sw-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sw-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway (Go)
  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    container_name: sw-api-gateway
    ports:
      - "8080:8080"
    environment:
      API_ENCRYPTION_KEY: ${API_ENCRYPTION_KEY:-changeme_32bytes_padded_key_here}
      JWT_SECRET: ${JWT_SECRET:-changeme}
      AUTH_SERVICE_URL: http://auth-service:8081
      WIZARD_SERVICE_URL: http://wizard-service:3001
      AI_SERVICE_URL: http://ai-service:3002
      TTS_SERVICE_URL: http://tts-service:3003
      ADMIN_SERVICE_URL: http://admin-service:8085
      KB_SERVICE_URL: http://kb-service:3004
    depends_on:
      auth-service:
        condition: service_started
      wizard-service:
        condition: service_started
      ai-service:
        condition: service_started
      tts-service:
        condition: service_started
      admin-service:
        condition: service_started
      kb-service:
        condition: service_started

  # Go Services
  auth-service:
    build:
      context: ../auth-service
      dockerfile: Dockerfile
    container_name: sw-auth-service
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://sw_user:sw_secret@postgres:5432/storyweaver?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin-service:
    build:
      context: ../admin-service
      dockerfile: Dockerfile
    container_name: sw-admin-service
    ports:
      - "8085:8085"
    environment:
      DATABASE_URL: postgres://sw_user:sw_secret@postgres:5432/storyweaver?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_CORS_ALLOWED_ORIGINS: http://localhost:3005,http://sw-admin:3000
      NATS_URL: nats://nats:4222
      ADMIN_AUDIT_SUBJECT: admin.audit.events
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Services
  wizard-service:
    build:
      context: ../wizard-service
      dockerfile: Dockerfile
    container_name: sw-wizard-service
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://sw_user:sw_secret@postgres:5432/storyweaver?sslmode=disable
      NATS_URL: nats://nats:4222
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: sw-ai-service
    ports:
      - "3002:3002"
    environment:
      NATS_URL: nats://nats:4222
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-gemini}
      PORT: 3002
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  tts-service:
    build:
      context: ../tts-service
      dockerfile: Dockerfile
    container_name: sw-tts-service
    ports:
      - "3003:3003"
    environment:
      NATS_URL: nats://nats:4222
      VBEE_API_KEY: ${VBEE_API_KEY}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-minioadmin123}
      MINIO_BUCKET: storyweaver-audio
      PORT: 3003
    depends_on:
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python Service (Knowledge Base)
  kb-service:
    build:
      context: ../kb-service
      dockerfile: Dockerfile
    container_name: sw-kb-service
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DATABASE_URL: postgres://sw_user:sw_secret@postgres:5432/storyweaver?sslmode=disable
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      EXA_API_KEY: ${EXA_API_KEY}
      BRAVE_API_KEY: ${BRAVE_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-gemini}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3004/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend (Next.js with nginx)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: sw-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api-gateway:8080
    depends_on:
      api-gateway:
        condition: service_started

  # Admin Dashboard (Next.js with nginx)
  admin:
    build:
      context: ../admin-dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_API_ENCRYPTION_KEY: ${API_ENCRYPTION_KEY:-changeme_32bytes_padded_key_here}
    container_name: sw-admin
    ports:
      - "3005:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_API_ENCRYPTION_KEY: ${API_ENCRYPTION_KEY:-changeme_32bytes_padded_key_here}
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  nats_data:
  minio_data:
