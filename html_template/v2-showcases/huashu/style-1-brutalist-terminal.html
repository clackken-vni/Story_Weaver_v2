<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoryWeaver Admin - Brutalist Terminal Collage</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body style="margin:0;">
  <div id="root"></div>

  <script type="text/babel">
    const brutalistRoutes = [
      'index','users','projects','monitoring','audit','settings','ai','kb','tts','login'
    ];

    const brutalistRouteData = {
      index: { title: 'Control Lobby', note: 'Primary operations grid is stable.', stats: [
        ['Live Sessions', '1,248'], ['Latency p95', '118ms'], ['Drafts Today', '349'], ['Errors', '7']
      ]},
      users: { title: 'User Registry', note: 'Identity and permission vectors.', stats: [
        ['Total Users', '8,942'], ['Editors', '2,311'], ['Suspended', '23'], ['Invites Pending', '61']
      ]},
      projects: { title: 'Project Assembly', note: 'Active narrative pipelines.', stats: [
        ['Active Projects', '192'], ['Shipped This Week', '34'], ['On Hold', '11'], ['Avg Cycle', '4.2d']
      ]},
      monitoring: { title: 'Runtime Monitor', note: 'System telemetry in hard mode.', stats: [
        ['CPU Load', '63%'], ['Queue Depth', '412'], ['Workers', '48'], ['Incidents', '2']
      ]},
      audit: { title: 'Audit Chronicle', note: 'Traceability and policy events.', stats: [
        ['Events / 24h', '74,201'], ['Policy Flags', '14'], ['Resolved', '12'], ['Escalated', '2']
      ]},
      settings: { title: 'System Wiring', note: 'Runtime toggles and guardrails.', stats: [
        ['Flags Enabled', '57'], ['Env Profiles', '4'], ['Webhook Targets', '12'], ['Backups', 'OK']
      ]},
      ai: { title: 'AI Forge', note: 'Model gateways and prompt rails.', stats: [
        ['Tokens / min', '2.8M'], ['Fallback Rate', '0.9%'], ['Guard Hits', '49'], ['Cost Today', '$128']
      ]},
      kb: { title: 'Knowledge Vault', note: 'Taxonomy and retrieval pathways.', stats: [
        ['Docs Indexed', '93,002'], ['Freshness', '97.1%'], ['Broken Links', '28'], ['Top Query Hit', '91%']
      ]},
      tts: { title: 'Voice Matrix', note: 'Narration and synthesis flows.', stats: [
        ['Voices Active', '17'], ['Jobs Today', '1,426'], ['Avg Render', '3.1s'], ['Failures', '5']
      ]},
      login: { title: 'Access Gate', note: 'Authentication heatmap and anomalies.', stats: [
        ['Success Rate', '98.7%'], ['2FA Enabled', '82%'], ['Blocked IPs', '46'], ['Risk Alerts', '3']
      ]}
    };

    const brutalistTableRows = [
      ['U-1942', 'Mai Linh', 'Editor', 'projects', 'Active'],
      ['U-2087', 'An V.', 'Reviewer', 'audit', 'Idle'],
      ['U-2231', 'Gia Bao', 'Admin', 'settings', 'Active'],
      ['U-2240', 'Khanh Ha', 'Analyst', 'monitoring', 'Review']
    ];

    const brutalistEvents = [
      '03:14 :: policy override acknowledged by U-2231',
      '03:10 :: ai queue spike detected in region ap-sg-2',
      '03:05 :: project P-881 moved to validation lane',
      '02:58 :: kb indexer restarted after stale lock cleanup'
    ];

    function BrutalistDashboard() {
      const [route, setRoute] = React.useState('index');
      const [isDark, setIsDark] = React.useState(true);
      const data = brutalistRouteData[route];

      const brutalistTheme = isDark
        ? { bg: '#0b0b0b', panel: '#111', text: '#f2f2f2', sub: '#b5b5b5', accent: '#f5ff00', line: '#2f2f2f' }
        : { bg: '#f4f4f0', panel: '#ffffff', text: '#161616', sub: '#4f4f4f', accent: '#111111', line: '#cacaca' };

      return (
        <div style={{
          minHeight: '100vh', background: brutalistTheme.bg, color: brutalistTheme.text,
          fontFamily: 'Space Mono, monospace', letterSpacing: '0.02em'
        }}>
          <div style={{ display: 'grid', gridTemplateColumns: '250px 1fr', minHeight: '100vh' }}>
            <aside style={{ borderRight: `3px solid ${brutalistTheme.line}`, padding: 18, background: brutalistTheme.panel }}>
              <div style={{ border: `3px solid ${brutalistTheme.accent}`, padding: 10, marginBottom: 20, fontWeight: 700 }}>
                STORYWEAVER//ADMIN
              </div>
              <button
                onClick={() => setIsDark(!isDark)}
                style={{
                  width: '100%', marginBottom: 16, padding: '8px 10px', background: brutalistTheme.bg,
                  color: brutalistTheme.text, border: `2px solid ${brutalistTheme.line}`, cursor: 'pointer', fontFamily: 'inherit'
                }}
              >
                MODE :: {isDark ? 'DARK' : 'LIGHT'}
              </button>
              {brutalistRoutes.map((item) => (
                <button
                  key={item}
                  onClick={() => setRoute(item)}
                  style={{
                    width: '100%', textAlign: 'left', marginBottom: 8, padding: '10px 12px',
                    border: `2px solid ${route === item ? brutalistTheme.accent : brutalistTheme.line}`,
                    background: route === item ? brutalistTheme.accent : 'transparent',
                    color: route === item ? '#000' : brutalistTheme.text,
                    cursor: 'pointer', textTransform: 'uppercase', fontFamily: 'inherit'
                  }}
                >
                  [{item}]
                </button>
              ))}
            </aside>

            <main style={{ padding: 22 }}>
              <header style={{ border: `3px solid ${brutalistTheme.line}`, padding: 16, marginBottom: 16 }}>
                <div style={{ fontSize: 12, color: brutalistTheme.sub }}>ROUTE::{route.toUpperCase()}</div>
                <h1 style={{ margin: '6px 0 4px', fontSize: 30 }}>{data.title}</h1>
                <p style={{ margin: 0, color: brutalistTheme.sub }}>{data.note}</p>
              </header>

              <section style={{ display: 'grid', gridTemplateColumns: 'repeat(4, minmax(130px,1fr))', gap: 12, marginBottom: 16 }}>
                {data.stats.map(([label, value]) => (
                  <div key={label} style={{
                    border: `3px solid ${brutalistTheme.line}`, padding: 12, background: brutalistTheme.panel,
                    boxShadow: `5px 5px 0 ${brutalistTheme.accent}`
                  }}>
                    <div style={{ fontSize: 11, color: brutalistTheme.sub }}>{label}</div>
                    <div style={{ fontSize: 28, marginTop: 4, fontWeight: 700 }}>{value}</div>
                  </div>
                ))}
              </section>

              <section style={{ display: 'grid', gridTemplateColumns: '1.35fr 1fr', gap: 12 }}>
                <div style={{ border: `3px solid ${brutalistTheme.line}`, background: brutalistTheme.panel, padding: 12 }}>
                  <h3 style={{ marginTop: 0, marginBottom: 10 }}>USER TABLE :: LIVE SAMPLE</h3>
                  <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12 }}>
                    <thead>
                      <tr>
                        {['ID', 'NAME', 'ROLE', 'ZONE', 'STATE'].map((h) => (
                          <th key={h} style={{ borderBottom: `2px solid ${brutalistTheme.line}`, padding: 8, textAlign: 'left' }}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {brutalistTableRows.map((r) => (
                        <tr key={r[0]}>
                          {r.map((c, i) => (
                            <td key={i} style={{ borderBottom: `1px dashed ${brutalistTheme.line}`, padding: 8, color: i === 4 ? brutalistTheme.accent : brutalistTheme.text }}>
                              {c}
                            </td>
                          ))}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div style={{ border: `3px solid ${brutalistTheme.line}`, background: brutalistTheme.panel, padding: 12 }}>
                  <h3 style={{ marginTop: 0, marginBottom: 10 }}>ACTIVITY FEED</h3>
                  <div style={{ display: 'grid', gap: 8 }}>
                    {brutalistEvents.map((ev) => (
                      <div key={ev} style={{ border: `2px solid ${brutalistTheme.line}`, padding: 9, fontSize: 12 }}>
                        {ev}
                      </div>
                    ))}
                  </div>
                </div>
              </section>
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<BrutalistDashboard />);
  </script>
</body>
</html>
