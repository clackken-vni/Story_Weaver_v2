<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StoryWeaver Admin v2 · Scandinavian Craft</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body style="margin: 0">
    <div id="root"></div>
    <script type="text/babel">
      const ROUTES = ["index", "users", "projects", "monitoring", "audit", "settings", "ai", "kb", "tts", "login"];
      const routeSummary = {
        index: "Overview of calm operations and team cadence.",
        users: "Member access, trust score, and profile health.",
        projects: "Roadmap pacing and delivery checkpoints.",
        monitoring: "Service wellness and uptime tendencies.",
        audit: "Accountability timeline and sensitive actions.",
        settings: "Workspace configuration and governance.",
        ai: "Model behavior, quality, and confidence trends.",
        kb: "Knowledge freshness and source reliability.",
        tts: "Voice output quality and generation load.",
        login: "Security sessions and authentication trends.",
      };

      const users = [
        { name: "Anna Vu", role: "Owner", region: "Nordic", status: "Calm" },
        { name: "Hieu Tran", role: "Ops", region: "SEA", status: "Watch" },
        { name: "Mika Lind", role: "Editor", region: "EU", status: "Calm" },
        { name: "Noah Le", role: "Audit", region: "US", status: "Review" },
      ];

      const feed = [
        "System update rolled out with zero interruption.",
        "Two policy exceptions flagged for gentle review.",
        "Project sunrise reached 92% completion.",
        "Speech queue reduced by 18% after scheduling tune.",
      ];

      function App() {
        const [active, setActive] = React.useState("index");
        const [dark, setDark] = React.useState(false);

        // Palette (Scandinavian Craft):
        // Birch: #F3EFE7, Oak: #D6C4AE, Sage: #A7B8A1, Dusty Blue: #90A9B7, Charcoal: #28343A
        const palette = dark
          ? { bg: "#232b2f", panel: "#2d373c", text: "#ecf0ec", muted: "#b8c3be", border: "#4c5a60", accent: "#a7b8a1", secondary: "#90a9b7" }
          : { bg: "#f3efe7", panel: "#ffffff", text: "#28343a", muted: "#607179", border: "#ddd2c3", accent: "#a7b8a1", secondary: "#90a9b7" };

        return (
          <div
            style={{
              minHeight: "100vh",
              background: palette.bg,
              color: palette.text,
              fontFamily: "Nunito, system-ui, sans-serif",
              display: "grid",
              gridTemplateColumns: "230px 1fr",
            }}
          >
            <aside style={{ padding: 14, display: "grid", gap: 10, alignContent: "start", borderRight: `1px solid ${palette.border}`, background: palette.panel }}>
              <div style={{ borderRadius: 18, background: dark ? "#39474d" : "#efe7db", padding: 14 }}>
                <div style={{ fontFamily: "Space Grotesk, sans-serif", fontWeight: 700, fontSize: 22 }}>Scandi Craft</div>
                <div style={{ marginTop: 4, color: palette.muted, fontSize: 12 }}>StoryWeaver Dashboard</div>
              </div>
              <button
                onClick={() => setDark(!dark)}
                style={{
                  height: 44,
                  borderRadius: 14,
                  border: `1px solid ${palette.border}`,
                  background: palette.secondary,
                  color: dark ? "#132126" : "#ffffff",
                  fontWeight: 700,
                  cursor: "pointer",
                  transition: "filter 180ms ease",
                }}
                onMouseEnter={(e) => (e.currentTarget.style.filter = "brightness(1.07)")}
                onMouseLeave={(e) => (e.currentTarget.style.filter = "brightness(1)")}
              >
                {dark ? "Birch Light" : "Evening Oak"}
              </button>
              {ROUTES.map((route) => (
                <button
                  key={route}
                  onClick={() => setActive(route)}
                  style={{
                    height: 40,
                    borderRadius: 12,
                    border: `1px solid ${active === route ? palette.secondary : palette.border}`,
                    background: active === route ? palette.secondary : "transparent",
                    color: active === route ? (dark ? "#122126" : "#ffffff") : palette.text,
                    textAlign: "left",
                    padding: "0 11px",
                    textTransform: "capitalize",
                    fontWeight: 600,
                    cursor: "pointer",
                    transition: "all 180ms ease",
                  }}
                >
                  {route}
                </button>
              ))}
            </aside>

            <main style={{ padding: 18, display: "grid", gap: 14 }}>
              <section style={{ background: palette.panel, border: `1px solid ${palette.border}`, borderRadius: 22, padding: 18 }}>
                <div style={{ fontFamily: "Space Grotesk, sans-serif", fontSize: 34, fontWeight: 700, textTransform: "capitalize" }}>{active}</div>
                <div style={{ color: palette.muted, marginTop: 8, maxWidth: 640, lineHeight: 1.5 }}>{routeSummary[active]}</div>
              </section>

              <section style={{ display: "grid", gridTemplateColumns: "repeat(4, minmax(0,1fr))", gap: 12 }}>
                <Stat palette={palette} label="Service Calm" value="96" unit="pts" />
                <Stat palette={palette} label="Issue Heat" value="07" unit="open" />
                <Stat palette={palette} label="Weekly Progress" value="84" unit="%" />
                <Stat palette={palette} label="Member Confidence" value="91" unit="pts" />
              </section>

              <section style={{ display: "grid", gridTemplateColumns: "1.4fr 1fr", gap: 12 }}>
                <article style={{ background: palette.panel, border: `1px solid ${palette.border}`, borderRadius: 22, padding: 12 }}>
                  <div style={{ fontFamily: "Space Grotesk, sans-serif", fontSize: 20, marginBottom: 10 }}>User Table</div>
                  <div style={{ display: "grid", gap: 7 }}>
                    <UserRow palette={palette} header row={{ name: "Name", role: "Role", region: "Region", status: "Status" }} />
                    {users.map((u) => (
                      <UserRow key={u.name} palette={palette} row={u} />
                    ))}
                  </div>
                </article>
                <article style={{ background: palette.panel, border: `1px solid ${palette.border}`, borderRadius: 22, padding: 12 }}>
                  <div style={{ fontFamily: "Space Grotesk, sans-serif", fontSize: 20, marginBottom: 10 }}>Activity Feed</div>
                  <div style={{ display: "grid", gap: 10 }}>
                    {feed.map((item, idx) => (
                      <div key={idx} style={{ borderRadius: 12, border: `1px solid ${palette.border}`, padding: 10, background: idx % 2 ? `${palette.accent}33` : `${palette.secondary}1a` }}>
                        {item}
                      </div>
                    ))}
                  </div>
                </article>
              </section>
            </main>
          </div>
        );
      }

      function Stat({ label, value, unit, palette }) {
        return (
          <article style={{ background: palette.panel, border: `1px solid ${palette.border}`, borderRadius: 20, padding: 14 }}>
            <div style={{ color: palette.muted, fontSize: 12, textTransform: "uppercase", letterSpacing: "0.06em" }}>{label}</div>
            <div style={{ marginTop: 10, display: "flex", alignItems: "baseline", gap: 8 }}>
              <div style={{ fontSize: 33, fontWeight: 800 }}>{value}</div>
              <div style={{ color: palette.muted, fontWeight: 600 }}>{unit}</div>
            </div>
          </article>
        );
      }

      function UserRow({ row, header, palette }) {
        const [hover, setHover] = React.useState(false);
        return (
          <div
            onMouseEnter={() => setHover(true)}
            onMouseLeave={() => setHover(false)}
            style={{
              display: "grid",
              gridTemplateColumns: "1.2fr .8fr .8fr .8fr",
              padding: "10px 8px",
              borderRadius: 12,
              border: `1px solid ${palette.border}`,
              background: header ? "transparent" : hover ? `${palette.secondary}22` : "transparent",
              fontWeight: header ? 700 : 500,
              fontSize: header ? 12 : 14,
              textTransform: header ? "uppercase" : "none",
              letterSpacing: header ? "0.05em" : "normal",
              transition: "background 180ms ease",
              cursor: header ? "default" : "pointer",
            }}
          >
            <span>{row.name}</span>
            <span>{row.role}</span>
            <span>{row.region}</span>
            <span>{row.status}</span>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
