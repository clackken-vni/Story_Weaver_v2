<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neo-Print Component Catalog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&family=Libre+Bodoni:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f5f1ea;
        --panel: #fffdf9;
        --ink: #1f1a16;
        --muted: #6b5d4d;
        --accent: #ad3f14;
        --line: #d9cec0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "IBM Plex Sans", sans-serif;
        background: var(--bg);
        color: var(--ink);
        transition: background 220ms ease, color 220ms ease;
      }

      .shell {
        max-width: 1280px;
        margin: 0 auto;
        padding: 36px 28px 80px;
      }

      .topbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 18px;
        margin-bottom: 28px;
      }

      .kicker {
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-size: 10px;
        color: var(--muted);
        margin-bottom: 8px;
      }

      h1,
      h2,
      h3 {
        font-family: "Libre Bodoni", serif;
        margin: 0;
      }

      h1 {
        font-size: clamp(32px, 5vw, 54px);
        line-height: 0.95;
        font-weight: 700;
      }

      .subtitle {
        margin-top: 10px;
        color: var(--muted);
        max-width: 720px;
      }

      .toggle {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        padding: 8px 14px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 10px;
        cursor: pointer;
      }

      .links {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 14px;
      }

      .links a,
      .toc a {
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px dashed var(--accent);
      }

      .toc {
        border: 1px solid var(--line);
        background: var(--panel);
        padding: 18px;
        margin: 20px 0 28px;
      }

      .toc h2 {
        font-size: 26px;
        margin-bottom: 10px;
      }

      .toc-grid {
        display: grid;
        gap: 8px 18px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        font-size: 14px;
      }

      .catalog-section {
        margin-top: 26px;
      }

      .catalog-section > h2 {
        font-size: 30px;
        margin-bottom: 14px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 8px;
      }

      .component-card {
        border: 1px solid var(--line);
        background: var(--panel);
        margin-bottom: 20px;
      }

      .component-head {
        border-bottom: 1px solid var(--line);
        padding: 16px 18px;
      }

      .component-head h3 {
        font-size: 28px;
      }

      .component-meta {
        margin-top: 6px;
        color: var(--muted);
        font-size: 13px;
      }

      .example-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 14px 14px 0;
      }

      .example-panel {
        border: 1px solid;
        padding: 14px;
      }

      .example-title {
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 10px;
        margin-bottom: 10px;
      }

      .meta-grid {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 16px;
        padding: 16px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      th,
      td {
        border: 1px solid var(--line);
        padding: 8px;
        text-align: left;
        vertical-align: top;
      }

      th {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        background: rgba(0, 0, 0, 0.03);
      }

      .usage-note {
        border: 1px dashed var(--line);
        padding: 12px;
        font-size: 13px;
        color: var(--muted);
      }

      .footer-note {
        margin-top: 22px;
        color: var(--muted);
        font-size: 12px;
      }

      @media (max-width: 980px) {
        .example-grid,
        .meta-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const themes = {
        light: {
          bg: "#f5f1ea",
          panel: "#fffdf9",
          ink: "#1f1a16",
          muted: "#6b5d4d",
          accent: "#ad3f14",
          line: "#d9cec0"
        },
        dark: {
          bg: "#141311",
          panel: "#1d1a17",
          ink: "#f0e7d8",
          muted: "#baa98d",
          accent: "#c46a2d",
          line: "#473d32"
        }
      };

      const toCssVars = (theme) => ({
        "--bg": theme.bg,
        "--panel": theme.panel,
        "--ink": theme.ink,
        "--muted": theme.muted,
        "--accent": theme.accent,
        "--line": theme.line
      });

      function Sidebar({ items = ["Overview", "Orders", "Print Queue", "Assets", "Settings"], active = "Overview", theme }) {
        return (
          <aside style={{ border: `1px solid ${theme.line}`, width: 220, padding: 10, background: theme.panel }}>
            <div style={{ fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase", color: theme.muted, marginBottom: 10 }}>StoryWeaver Admin</div>
            {items.map((item) => (
              <div key={item} style={{ marginBottom: 8, padding: "7px 8px", border: `1px solid ${item === active ? theme.accent : theme.line}`, color: item === active ? theme.accent : theme.ink, fontSize: 13 }}>
                {item}
              </div>
            ))}
          </aside>
        );
      }

      function Header({ route = "/admin/dashboard", headline = "Poster Grid Control Room", subline = "Track print runs, editorial campaigns, and design throughput.", theme }) {
        return (
          <header style={{ border: `1px solid ${theme.line}`, background: theme.panel, padding: 12 }}>
            <div style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: "0.16em", color: theme.muted }}>Route: {route}</div>
            <div style={{ fontFamily: "'Libre Bodoni', serif", fontSize: 28, lineHeight: 1, marginTop: 6 }}>{headline}</div>
            <p style={{ margin: "7px 0 0", fontSize: 13, color: theme.muted }}>{subline}</p>
          </header>
        );
      }

      function KpiCard({ label = "Total Posters", value = "12,480", trend = "+6.7%", tone = "accent", theme }) {
        const toneColor = tone === "positive" ? "#2f7a4d" : tone === "negative" ? "#8d2f2f" : theme.accent;
        return (
          <article style={{ border: `1px solid ${theme.line}`, background: theme.panel, padding: 12 }}>
            <div style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: "0.13em", color: theme.muted }}>{label}</div>
            <div style={{ fontFamily: "'Libre Bodoni', serif", fontSize: 32, marginTop: 6 }}>{value}</div>
            <div style={{ marginTop: 8, fontSize: 12, color: toneColor }}>{trend} vs last cycle</div>
          </article>
        );
      }

      function DataTable({ rows, columns, theme }) {
        return (
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12, border: `1px solid ${theme.line}`, background: theme.panel }}>
            <thead>
              <tr>
                {columns.map((col) => (
                  <th key={col.key} style={{ border: `1px solid ${theme.line}`, padding: 6, textAlign: "left", textTransform: "uppercase", letterSpacing: "0.08em", color: theme.muted, fontSize: 10 }}>
                    {col.label}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map((row) => (
                <tr key={row.id}>
                  {columns.map((col) => (
                    <td key={col.key} style={{ border: `1px solid ${theme.line}`, padding: 6 }}>{row[col.key]}</td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        );
      }

      function ActivityFeed({ events, theme }) {
        return (
          <section style={{ border: `1px dashed ${theme.line}`, background: theme.panel, padding: 10 }}>
            {events.map((event) => (
              <div key={event.id} style={{ padding: "8px 0", borderBottom: `1px solid ${theme.line}` }}>
                <div style={{ fontSize: 12 }}>{event.text}</div>
                <div style={{ fontSize: 10, color: theme.muted, marginTop: 4 }}>{event.time}</div>
              </div>
            ))}
          </section>
        );
      }

      function Button({ label = "Apply", variant = "primary", theme }) {
        const isGhost = variant === "ghost";
        return (
          <button
            type="button"
            style={{
              border: `1px solid ${isGhost ? theme.line : theme.accent}`,
              background: isGhost ? "transparent" : theme.accent,
              color: isGhost ? theme.ink : "#f5f1ea",
              padding: "8px 12px",
              fontSize: 12,
              cursor: "pointer",
              textTransform: "uppercase",
              letterSpacing: "0.06em"
            }}
          >
            {label}
          </button>
        );
      }

      function ThemeDemo({ theme }) {
        return (
          <div style={{ border: `1px solid ${theme.line}`, background: theme.panel, padding: 10 }}>
            <div style={{ fontSize: 11, marginBottom: 8 }}>Current background token: <strong>{theme.bg}</strong></div>
            <div style={{ display: "flex", gap: 8 }}>
              <div style={{ width: 32, height: 32, border: `1px solid ${theme.line}`, background: theme.bg }}></div>
              <div style={{ width: 32, height: 32, border: `1px solid ${theme.line}`, background: theme.panel }}></div>
              <div style={{ width: 32, height: 32, border: `1px solid ${theme.line}`, background: theme.accent }}></div>
            </div>
          </div>
        );
      }

      function StatGrid({ theme }) {
        return (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, minmax(0,1fr))", gap: 8 }}>
            <KpiCard label="Prints" value="12.4k" trend="+4.2%" theme={theme} />
            <KpiCard label="Orders" value="3,290" trend="+1.7%" tone="positive" theme={theme} />
            <KpiCard label="Returns" value="84" trend="-0.8%" tone="positive" theme={theme} />
            <KpiCard label="Lead Time" value="2.1d" trend="-4.1%" tone="positive" theme={theme} />
          </div>
        );
      }

      function TwoColumn({ theme }) {
        return (
          <div style={{ display: "grid", gridTemplateColumns: "1.4fr 1fr", gap: 10 }}>
            <div style={{ border: `1px solid ${theme.line}`, background: theme.panel, padding: 10, minHeight: 100 }}>
              <div style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: "0.12em", color: theme.muted }}>Primary Column</div>
              <div style={{ marginTop: 8, fontSize: 12 }}>Campaign performance board, editorial annotations, and production timeline snapshots.</div>
            </div>
            <div style={{ border: `1px dashed ${theme.line}`, background: theme.panel, padding: 10, minHeight: 100 }}>
              <div style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: "0.12em", color: theme.muted }}>Secondary Column</div>
              <div style={{ marginTop: 8, fontSize: 12 }}>Queue updates, exceptions, and operator actions.</div>
            </div>
          </div>
        );
      }

      function DashboardLayout({ theme }) {
        return (
          <div style={{ display: "grid", gridTemplateColumns: "220px 1fr", gap: 10 }}>
            <Sidebar theme={theme} />
            <div style={{ display: "grid", gap: 10 }}>
              <Header theme={theme} />
              <StatGrid theme={theme} />
              <TwoColumn theme={theme} />
            </div>
          </div>
        );
      }

      const tableColumns = [
        { key: "order", label: "Order" },
        { key: "sku", label: "SKU" },
        { key: "status", label: "Status" },
        { key: "eta", label: "ETA" }
      ];

      const tableRows = [
        { id: 1, order: "#NP-901", sku: "EDITORIAL-A2", status: "In Print", eta: "18:40" },
        { id: 2, order: "#NP-902", sku: "NEO-BROADSHEET", status: "Packed", eta: "19:05" },
        { id: 3, order: "#NP-903", sku: "GRID-POSTER-XL", status: "Blocked", eta: "Review" }
      ];

      const events = [
        { id: 1, text: "Queue lock released for Run 44B", time: "4m ago" },
        { id: 2, text: "New editorial brief synced to print profile", time: "12m ago" },
        { id: 3, text: "Color calibration approved by art lead", time: "23m ago" }
      ];

      const sections = [
        {
          id: "base-components",
          title: "Base Components",
          components: [
            {
              name: "Theme",
              file: "components/base/Theme.jsx",
              render: (theme) => <ThemeDemo theme={theme} />,
              props: [
                ["mode", "'light' | 'dark'", "Controls token set at root scope"],
                ["onToggle", "() => void", "Theme switch handler"],
                ["children", "ReactNode", "Nested component tree"]
              ],
              notes: "Use once at app root. This wrapper maps light/dark tokens to CSS variables and keeps all child components token-driven."
            },
            {
              name: "Sidebar",
              file: "components/base/Sidebar.jsx",
              render: (theme) => <Sidebar theme={theme} />,
              props: [
                ["items", "string[]", "Navigation labels"],
                ["active", "string", "Currently active nav key"],
                ["theme", "ThemeTokens", "Color token object"]
              ],
              notes: "Use 280px width in full layouts. Keep labels concise to preserve the editorial rhythm and avoid wrapping."
            },
            {
              name: "Header",
              file: "components/base/Header.jsx",
              render: (theme) => <Header theme={theme} route="/admin/queue" headline="Production Queue Ledger" subline="Sort by urgency, operator bandwidth, and paper stock." />,
              props: [
                ["route", "string", "Current route path for contextual cue"],
                ["headline", "string", "Display-level page heading"],
                ["subline", "string", "Supporting description"],
                ["theme", "ThemeTokens", "Color token object"]
              ],
              notes: "Hero heading should stay in Libre Bodoni with tight line height to maintain the magazine masthead aesthetic."
            },
            {
              name: "KpiCard",
              file: "components/base/KpiCard.jsx",
              render: (theme) => (
                <div style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0,1fr))", gap: 8 }}>
                  <KpiCard label="Gross Margin" value="38.2%" trend="+2.3%" theme={theme} />
                  <KpiCard label="Reprints" value="116" trend="-1.1%" tone="positive" theme={theme} />
                  <KpiCard label="Hold Flags" value="14" trend="+3.9%" tone="negative" theme={theme} />
                </div>
              ),
              props: [
                ["label", "string", "Metric label"],
                ["value", "string | number", "Primary displayed value"],
                ["trend", "string", "Comparison string"],
                ["tone", "'accent' | 'positive' | 'negative'", "Trend color mode"]
              ],
              notes: "Use short value strings and semantic trend colors. Avoid decorative icons to keep emphasis on numeric storytelling."
            },
            {
              name: "DataTable",
              file: "components/base/DataTable.jsx",
              render: (theme) => <DataTable theme={theme} columns={tableColumns} rows={tableRows} />,
              props: [
                ["columns", "{key,label}[]", "Column metadata"],
                ["rows", "Record<string, string>[]", "Tabular data rows"],
                ["theme", "ThemeTokens", "Color token object"]
              ],
              notes: "Keep table headers uppercase with tracking to echo print catalog labels and improve scanability."
            },
            {
              name: "ActivityFeed",
              file: "components/base/ActivityFeed.jsx",
              render: (theme) => <ActivityFeed theme={theme} events={events} />,
              props: [
                ["events", "{id,text,time}[]", "Chronological event items"],
                ["theme", "ThemeTokens", "Color token object"]
              ],
              notes: "Best for right-column operational context; event strings should be short, factual, and timestamped."
            },
            {
              name: "Button",
              file: "components/base/Button.jsx",
              render: (theme) => (
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <Button theme={theme} label="Publish Grid" variant="primary" />
                  <Button theme={theme} label="View History" variant="ghost" />
                </div>
              ),
              props: [
                ["label", "string", "Button text"],
                ["variant", "'primary' | 'ghost'", "Visual hierarchy style"],
                ["onClick", "() => void", "Interaction callback"]
              ],
              notes: "Primary actions use accent fill; secondary actions use ghost styling with clear borders for print-like restraint."
            }
          ]
        },
        {
          id: "composed-components",
          title: "Composed Components",
          components: [
            {
              name: "DashboardLayout",
              file: "components/composed/DashboardLayout.jsx",
              render: (theme) => <DashboardLayout theme={theme} />,
              props: [
                ["sidebar", "ReactNode", "Navigation column"],
                ["header", "ReactNode", "Hero header row"],
                ["children", "ReactNode", "Main layout content"]
              ],
              notes: "Primary composition shell for route pages. Left rail remains fixed-width while right zone adapts to content depth."
            },
            {
              name: "StatGrid",
              file: "components/composed/StatGrid.jsx",
              render: (theme) => <StatGrid theme={theme} />,
              props: [
                ["items", "KpiItem[]", "Array of metric cards"],
                ["columns", "number", "Responsive column count, default 4"],
                ["theme", "ThemeTokens", "Color token object"]
              ],
              notes: "Default 4-column desktop rhythm. Collapse to 2 or 1 columns at narrower breakpoints while retaining metric hierarchy."
            },
            {
              name: "TwoColumn",
              file: "components/composed/TwoColumn.jsx",
              render: (theme) => <TwoColumn theme={theme} />,
              props: [
                ["left", "ReactNode", "Primary 1.4fr content"],
                ["right", "ReactNode", "Secondary 1fr content"],
                ["gap", "number", "Grid gap token"]
              ],
              notes: "Use for editorial priority split: dense analytical view on left and supporting queue/action content on right."
            }
          ]
        }
      ];

      function ExamplePanel({ label, mode, render }) {
        const theme = themes[mode];
        return (
          <div className="example-panel" style={{ borderColor: theme.line, background: theme.bg, color: theme.ink }}>
            <div className="example-title" style={{ color: theme.muted }}>{label}</div>
            {render(theme)}
          </div>
        );
      }

      function CatalogApp() {
        const [mode, setMode] = React.useState("light");

        React.useEffect(() => {
          const theme = themes[mode];
          const root = document.documentElement;
          root.style.setProperty("--bg", theme.bg);
          root.style.setProperty("--panel", theme.panel);
          root.style.setProperty("--ink", theme.ink);
          root.style.setProperty("--muted", theme.muted);
          root.style.setProperty("--accent", theme.accent);
          root.style.setProperty("--line", theme.line);
        }, [mode]);

        const tocItems = sections.flatMap((section) =>
          section.components.map((component) => ({
            id: `${section.id}-${component.name.toLowerCase()}`,
            title: `${component.name} (${section.title})`
          }))
        );

        return (
          <div className="shell">
            <header className="topbar">
              <div>
                <div className="kicker">Neo-Print Prototype Showcase</div>
                <h1>Component Catalog</h1>
                <p className="subtitle">
                  Complete inventory of the Neo-Print Poster Grid component system with live base/composed renders, prop contracts, and implementation notes.
                </p>
                <div className="links">
                  <a href="./page-gallery.html">Page Gallery</a>
                  <a href="./design-tokens.html">Design Tokens</a>
                  <a href="../index.html">Prototype Entry</a>
                </div>
              </div>
              <button className="toggle" onClick={() => setMode(mode === "light" ? "dark" : "light")}>
                Toggle {mode === "light" ? "Dark" : "Light"} Theme
              </button>
            </header>

            <section className="toc">
              <h2>Table of Contents</h2>
              <div className="toc-grid">
                {tocItems.map((item) => (
                  <a key={item.id} href={`#${item.id}`}>{item.title}</a>
                ))}
              </div>
            </section>

            {sections.map((section) => (
              <section className="catalog-section" id={section.id} key={section.id}>
                <h2>{section.title}</h2>
                {section.components.map((component) => {
                  const anchor = `${section.id}-${component.name.toLowerCase()}`;
                  return (
                    <article className="component-card" id={anchor} key={component.name}>
                      <div className="component-head">
                        <h3>{component.name}</h3>
                        <div className="component-meta">File: <code>{component.file}</code></div>
                      </div>

                      <div className="example-grid">
                        <ExamplePanel label="Light Render" mode="light" render={component.render} />
                        <ExamplePanel label="Dark Render" mode="dark" render={component.render} />
                      </div>

                      <div className="meta-grid">
                        <div>
                          <table>
                            <thead>
                              <tr>
                                <th>Prop</th>
                                <th>Type</th>
                                <th>Description</th>
                              </tr>
                            </thead>
                            <tbody>
                              {component.props.map(([prop, type, description]) => (
                                <tr key={prop}>
                                  <td><code>{prop}</code></td>
                                  <td><code>{type}</code></td>
                                  <td>{description}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                        <div>
                          <div className="usage-note">{component.notes}</div>
                        </div>
                      </div>
                    </article>
                  );
                })}
              </section>
            ))}

            <div className="footer-note">
              Global preview mode: <strong>{mode}</strong>. Individual examples always include explicit light and dark renders for side-by-side evaluation.
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<CatalogApp />);
    </script>
  </body>
</html>
